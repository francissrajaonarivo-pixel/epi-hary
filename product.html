<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="pageTitle">Produit — EPI-HARY</title>
<link rel="icon" type="image/svg+xml" href="images/logo-mark.svg">

<!-- Aperçu de lien (WhatsApp, Facebook, etc.) -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="EPI-HARY">
<meta property="og:title" content="EPI-HARY — Épicerie en ligne">
<meta property="og:description" content="Produits frais, commande simple via WhatsApp, livraison le jour même à Mahajanga.">
<meta property="og:image" content="https://francissrajaonarivo-pixel.github.io/epi-hary/images/og-banner.svg">
<meta name="twitter:card" content="summary_large_image">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="site-header">
  <div class="container header-inner">
    <a href="index.html" class="logo"><img src="images/logo.svg" alt="EPI-HARY" class="logo-img"></a>
    <nav class="main-nav">
      <a href="index.html#produits">Produits</a>
      <a href="index.html#a-propos">À propos</a>
      <a href="index.html#contact">Contact</a>
    </nav>
    <button class="cart-btn" id="cartBtn">
      🛒 <span id="cartCount">0</span>
    </button>
  </div>
</header>

<main class="container">

  <nav class="breadcrumb" id="breadcrumb">
    <a href="index.html">Accueil</a> / <a href="index.html#produits">Produits</a> / <span id="breadcrumbName"></span>
  </nav>

  <section class="product-detail" id="productDetail">
    <!-- Généré par JavaScript -->
  </section>

  <section class="related-section">
    <h2>Produits similaires</h2>
    <div class="products-grid" id="relatedGrid">
      <!-- Généré par JavaScript -->
    </div>
  </section>

</main>

<footer class="site-footer">
  <div class="container">
    <p>© 2026 EPI-HARY. Tous droits réservés.</p>
  </div>
</footer>

<!-- Panier (drawer) -->
<div class="cart-overlay" id="cartOverlay"></div>
<aside class="cart-drawer" id="cartDrawer">
  <div class="cart-drawer-header">
    <h3>Votre panier</h3>
    <button class="close-btn" id="closeCart">✕</button>
  </div>
  <div class="cart-items" id="cartItems">
    <p class="cart-empty">Votre panier est vide.</p>
  </div>
  <div class="cart-footer">
    <div class="cart-total">
      <span>Total</span>
      <span id="cartTotal">0,00 €</span>
    </div>
    <button class="btn btn-primary btn-full" id="checkoutBtn">Commander</button>
  </div>
</aside>

<!-- Confirmation de commande -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <h3>Commande envoyée ! 🎉</h3>
    <div id="modalBody"><p>Merci pour votre commande.</p></div>
    <button class="btn btn-primary" id="closeModal">Fermer</button>
  </div>
</div>

<script src="js/store.js"></script>
<script src="js/product.js"></script>
</body>
</html>
